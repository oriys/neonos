# 这个文件定义 GitHub Actions 的持续集成（CI）流程。
# 每次 push 或提交 Pull Request 时，GitHub 都会自动创建一台临时机器，
# 编译并真正启动一次我们的 RISC-V 内核，防止代码改坏后却没有发现。

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boot:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          rustup target add riscv64gc-unknown-none-elf
          HOMEBREW_NO_AUTO_UPDATE=1 brew install qemu

      - name: Build and boot kernel
        run: ./tests/boot.sh

      # 新增 lesson checkpoint 文件通过 GitHub Contents API 创建时不依赖 executable bit，
      # 所以显式交给 `/bin/sh` 执行；测试语义与文件权限解耦。
      - name: Verify lesson 01 checkpoint
        run: sh ./tests/lesson-01.sh
