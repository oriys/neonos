# 这个文件定义 GitHub Actions 的持续集成（CI）流程。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boot:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          rustup target add riscv64gc-unknown-none-elf
          HOMEBREW_NO_AUTO_UPDATE=1 brew install qemu

      - name: Build and boot kernel
        run: ./tests/boot.sh

      - name: Verify lesson 01 checkpoint
        run: sh ./tests/lesson-01.sh

      - name: Verify lesson 02 checkpoint
        run: sh ./tests/lesson-02.sh

      - name: Verify lesson 03 checkpoint
        run: sh ./tests/lesson-03.sh

      - name: Verify lesson 04 checkpoint
        run: sh ./tests/lesson-04.sh

      - name: Verify lesson 05 checkpoint
        run: sh ./tests/lesson-05.sh

      - name: Verify lesson 06 checkpoint
        run: sh ./tests/lesson-06.sh

      - name: Verify lesson 07 checkpoint
        run: sh ./tests/lesson-07.sh
