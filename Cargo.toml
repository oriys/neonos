# `[package]` 描述这个 Rust 包本身的基本信息。
[package]
name = "neonos"
version = "0.1.0"
edition = "2024"

# 教学测试 feature 默认全部关闭；正常内核只保留已经学会的能力，不主动制造故障。
[features]
default = []
lesson03-panic = []
lesson04-bss-probe = []
lesson04-skip-bss-clear = []

# 第 05 课：安装 stvec 后调用独立汇编触发器，制造一次受控非法指令异常。
lesson05-illegal-trap = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
