# `[package]` 描述这个 Rust 包本身的基本信息。
[package]
name = "neonos"
version = "0.1.0"
edition = "2024"

# 教学测试 feature 默认全部关闭；默认启动不主动制造故障或切进不会返回的实验路径。
[features]
default = []
lesson03-panic = []
lesson04-bss-probe = []
lesson04-skip-bss-clear = []
lesson05-illegal-trap = []

# 第 07 课：真正执行 sret 进入 U-mode，再由一个用户 ecall 回到可信 S-mode trap 栈。
lesson07-user-mode = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
