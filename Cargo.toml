# `[package]` 描述这个 Rust 包本身的基本信息。
[package]
name = "neonos"
version = "0.1.0"
edition = "2024"

# 教学测试 feature 默认全部关闭；正常内核不会故意 panic，也不会跳过 BSS 初始化。
[features]
default = []
lesson03-panic = []

# 第 04 课：在最早启动阶段先把一个 BSS probe 写成非零，再观察清零结果。
lesson04-bss-probe = []

# 仅用于第 04 课的负例：故意跳过普通 BSS 清零，证明 probe 会保留非零模式。
lesson04-skip-bss-clear = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
