# `[package]` 描述这个 Rust 包本身的基本信息。
[package]
name = "neonos"
version = "0.1.0"
edition = "2024"

# 教学测试 feature 默认全部关闭；默认启动不主动制造故障或切进不会返回的实验路径。
[features]
default = []
lesson03-panic = []
lesson04-bss-probe = []
lesson04-skip-bss-clear = []
lesson05-illegal-trap = []
lesson07-user-mode = []

# 第 08 课：多次 U-mode ecall，经内核修改 TrapFrame 后恢复全部用户现场并 sret 返回。
lesson08-syscalls = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
